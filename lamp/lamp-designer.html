<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adire Lamp Designer</title>
<style>
  :root {
    --bg: #F5EFE0; --panel: #FFFFFF; --ink: #1B2A6B; --muted: #5A6283;
    --accent: #C4622D; --line: #E2D9C4; --stage: #EDE5D2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1430; --panel: #161E44; --ink: #F5EFE0; --muted: #A9AFCB;
      --accent: #E07A43; --line: #2A3466; --stage: #0A0F25;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1430; --panel: #161E44; --ink: #F5EFE0; --muted: #A9AFCB;
    --accent: #E07A43; --line: #2A3466; --stage: #0A0F25;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px;
         max-width: 1100px; margin: 0 auto; padding: 12px 16px 32px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  select, input[type=number] { width: 100%; padding: 8px 10px; border-radius: 8px;
         border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .row label { margin-top: 0; font-weight: 500; color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; padding: 8px; border: 0; background: transparent; color: var(--ink);
                font: inherit; cursor: pointer; }
  .seg button.on { background: var(--ink); color: var(--bg); }
  .actions { display: grid; gap: 8px; margin-top: 18px; }
  .btn { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink);
         color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .stage { background: var(--stage); border-radius: 12px; display: grid; place-items: center;
           min-height: 420px; transition: background .4s; }
  .stage.lit { background: #120D08; }
  .stage svg { width: 100%; max-width: 420px; height: auto; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 14px 0 0; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .warn { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Adire Lamp Designer</h1>
  <p>Pick a pattern and a shade size, check it lit and unlit, then download the flat wrap file for printing.</p>
</header>
<main>
  <section class="panel" aria-label="Controls">
    <label for="pattern">Pattern</label>
    <select id="pattern"></select>

    <label>Shade shape</label>
    <div class="seg" id="shape">
      <button data-v="drum" class="on">Drum</button>
      <button data-v="empire">Tapered</button>
    </div>

    <label>Size (mm)</label>
    <div class="row">
      <div><label for="dt">Top Ø</label><input id="dt" type="number" min="80" max="600" value="300"></div>
      <div><label for="db">Bottom Ø</label><input id="db" type="number" min="80" max="600" value="300"></div>
      <div><label for="h">Height</label><input id="h" type="number" min="80" max="500" value="220"></div>
    </div>

    <label for="motif">Motif size: <span id="motifOut"></span> mm</label>
    <input id="motif" type="range" min="20" max="120" value="50">

    <label>Preview</label>
    <div class="seg" id="light">
      <button data-v="off" class="on">Light off</button>
      <button data-v="on">Light on</button>
    </div>

    <div class="actions">
      <button class="btn" id="dl">Download print wrap (SVG, mm)</button>
      <button class="btn ghost" id="dlMock">Download mockup (SVG)</button>
    </div>

    <dl id="spec"></dl>
    <p class="note">The wrap file has a 3 mm bleed, a red cut line and a dashed 15 mm glue overlap. Print it on lampshade styrene or backed fabric at 100% scale.</p>
  </section>

  <section class="stage" id="stage" aria-label="Lamp preview"></section>
</main>

<script>
const PATTERNS = [{"id": "adire-pattern-2", "name": "Adire Oniko Textile Pattern", "size": 120, "body": "<rect width=\"120\" height=\"120\" fill=\"#1B2A6B\"/> <circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"#F5EFE0\" stroke-width=\"2\"/> <circle cx=\"60\" cy=\"60\" r=\"35\" fill=\"none\" stroke=\"#F5EFE0\" stroke-width=\"1.4\"/> <circle cx=\"60\" cy=\"60\" r=\"20\" fill=\"none\" stroke=\"#C4622D\" stroke-width=\"1.6\"/> <line x1=\"60\" y1=\"10\" x2=\"60\" y2=\"24\" stroke=\"#F5EFE0\" stroke-width=\"1.5\" opacity=\"0.7\"/> <line x1=\"60\" y1=\"96\" x2=\"60\" y2=\"110\" stroke=\"#F5EFE0\" stroke-width=\"1.5\" opacity=\"0.7\"/> <line x1=\"10\" y1=\"60\" x2=\"24\" y2=\"60\" stroke=\"#F5EFE0\" stroke-width=\"1.5\" opacity=\"0.7\"/> <line x1=\"96\" y1=\"60\" x2=\"110\" y2=\"60\" stroke=\"#F5EFE0\" stroke-width=\"1.5\" opacity=\"0.7\"/> <line x1=\"25\" y1=\"25\" x2=\"33\" y2=\"33\" stroke=\"#F5EFE0\" stroke-width=\"1\" opacity=\"0.45\"/> <line x1=\"95\" y1=\"25\" x2=\"87\" y2=\"33\" stroke=\"#F5EFE0\" stroke-width=\"1\" opacity=\"0.45\"/> <line x1=\"95\" y1=\"95\" x2=\"87\" y2=\"87\" stroke=\"#F5EFE0\" stroke-width=\"1\" opacity=\"0.45\"/> <line x1=\"25\" y1=\"95\" x2=\"33\" y2=\"87\" stroke=\"#F5EFE0\" stroke-width=\"1\" opacity=\"0.45\"/> <rect x=\"56\" y=\"9\" width=\"8\" height=\"6\" rx=\"1\" fill=\"#C4622D\"/> <rect x=\"56\" y=\"105\" width=\"8\" height=\"6\" rx=\"1\" fill=\"#C4622D\"/> <rect x=\"9\" y=\"56\" width=\"6\" height=\"8\" rx=\"1\" fill=\"#C4622D\"/> <rect x=\"105\" y=\"56\" width=\"6\" height=\"8\" rx=\"1\" fill=\"#C4622D\"/> <circle cx=\"74\" cy=\"60\" r=\"2.5\" fill=\"#C4622D\"/> <circle cx=\"70\" cy=\"70\" r=\"2.5\" fill=\"#C4622D\"/> <circle cx=\"60\" cy=\"74\" r=\"2.5\" fill=\"#C4622D\"/> <circle cx=\"50\" cy=\"70\" r=\"2.5\" fill=\"#C4622D\"/> <circle cx=\"46\" cy=\"60\" r=\"2.5\" fill=\"#C4622D\"/> <circle cx=\"50\" cy=\"50\" r=\"2.5\" fill=\"#C4622D\"/> <circle cx=\"60\" cy=\"46\" r=\"2.5\" fill=\"#C4622D\"/> <circle cx=\"70\" cy=\"50\" r=\"2.5\" fill=\"#C4622D\"/> <polygon points=\"60,0 65,5 60,10 55,5\" fill=\"#F5EFE0\" opacity=\"0.5\"/> <polygon points=\"60,110 65,115 60,120 55,115\" fill=\"#F5EFE0\" opacity=\"0.5\"/> <polygon points=\"0,60 5,55 10,60 5,65\" fill=\"#F5EFE0\" opacity=\"0.5\"/> <polygon points=\"110,60 115,55 120,60 115,65\" fill=\"#F5EFE0\" opacity=\"0.5\"/> <circle cx=\"60\" cy=\"60\" r=\"7\" fill=\"#C4622D\"/> <circle cx=\"60\" cy=\"60\" r=\"3\" fill=\"#F5EFE0\"/>"}, {"id": "adire-pattern-3", "name": "Adire Eleko Textile Pattern", "size": 80, "body": "<rect width=\"80\" height=\"80\" fill=\"#1B2A6B\"/> <rect x=\"4\" y=\"4\" width=\"72\" height=\"72\" fill=\"none\" stroke=\"#F5EFE0\" stroke-width=\"2\"/> <rect x=\"16\" y=\"16\" width=\"48\" height=\"48\" fill=\"none\" stroke=\"#F5EFE0\" stroke-width=\"1.4\"/> <rect x=\"28\" y=\"28\" width=\"24\" height=\"24\" fill=\"none\" stroke=\"#C4622D\" stroke-width=\"2\"/> <rect x=\"35\" y=\"35\" width=\"10\" height=\"10\" fill=\"#C4622D\"/> <line x1=\"4\" y1=\"4\" x2=\"16\" y2=\"16\" stroke=\"#F5EFE0\" stroke-width=\"1.2\" opacity=\"0.6\"/> <line x1=\"76\" y1=\"4\" x2=\"64\" y2=\"16\" stroke=\"#F5EFE0\" stroke-width=\"1.2\" opacity=\"0.6\"/> <line x1=\"76\" y1=\"76\" x2=\"64\" y2=\"64\" stroke=\"#F5EFE0\" stroke-width=\"1.2\" opacity=\"0.6\"/> <line x1=\"4\" y1=\"76\" x2=\"16\" y2=\"64\" stroke=\"#F5EFE0\" stroke-width=\"1.2\" opacity=\"0.6\"/> <line x1=\"0\" y1=\"40\" x2=\"80\" y2=\"40\" stroke=\"#C4622D\" stroke-width=\"0.7\" opacity=\"0.3\"/> <line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"80\" stroke=\"#C4622D\" stroke-width=\"0.7\" opacity=\"0.3\"/> <polygon points=\"40,0 44,4 40,8 36,4\" fill=\"#C4622D\"/> <polygon points=\"40,72 44,76 40,80 36,76\" fill=\"#C4622D\"/> <polygon points=\"0,40 4,36 8,40 4,44\" fill=\"#C4622D\"/> <polygon points=\"72,40 76,36 80,40 76,44\" fill=\"#C4622D\"/> <circle cx=\"40\" cy=\"40\" r=\"2.5\" fill=\"#F5EFE0\"/>"}, {"id": "adire-pattern", "name": "Adire Indigo Textile Pattern", "size": 100, "body": "<rect width=\"100\" height=\"100\" fill=\"#1B2A6B\"/> <polygon points=\"50,3 97,50 50,97 3,50\" fill=\"none\" stroke=\"#F5EFE0\" stroke-width=\"2\"/> <polygon points=\"50,22 78,50 50,78 22,50\" fill=\"none\" stroke=\"#F5EFE0\" stroke-width=\"1.2\"/> <line x1=\"3\" y1=\"50\" x2=\"97\" y2=\"50\" stroke=\"#C4622D\" stroke-width=\"0.7\" opacity=\"0.35\"/> <line x1=\"50\" y1=\"3\" x2=\"50\" y2=\"97\" stroke=\"#C4622D\" stroke-width=\"0.7\" opacity=\"0.35\"/> <line x1=\"0\" y1=\"0\" x2=\"100\" y2=\"100\" stroke=\"#F5EFE0\" stroke-width=\"0.4\" opacity=\"0.12\"/> <line x1=\"100\" y1=\"0\" x2=\"0\" y2=\"100\" stroke=\"#F5EFE0\" stroke-width=\"0.4\" opacity=\"0.12\"/> <circle cx=\"50\" cy=\"3\" r=\"3.8\" fill=\"#C4622D\"/> <circle cx=\"97\" cy=\"50\" r=\"3.8\" fill=\"#C4622D\"/> <circle cx=\"50\" cy=\"97\" r=\"3.8\" fill=\"#C4622D\"/> <circle cx=\"3\" cy=\"50\" r=\"3.8\" fill=\"#C4622D\"/> <line x1=\"67\" y1=\"22\" x2=\"78\" y2=\"33\" stroke=\"#F5EFE0\" stroke-width=\"1.3\" opacity=\"0.65\"/> <line x1=\"67\" y1=\"78\" x2=\"78\" y2=\"67\" stroke=\"#F5EFE0\" stroke-width=\"1.3\" opacity=\"0.65\"/> <line x1=\"22\" y1=\"78\" x2=\"33\" y2=\"67\" stroke=\"#F5EFE0\" stroke-width=\"1.3\" opacity=\"0.65\"/> <line x1=\"22\" y1=\"22\" x2=\"33\" y2=\"33\" stroke=\"#F5EFE0\" stroke-width=\"1.3\" opacity=\"0.65\"/> <polygon points=\"50,43 57,50 50,57 43,50\" fill=\"#C4622D\"/> <circle cx=\"14\" cy=\"14\" r=\"2.2\" fill=\"#F5EFE0\" opacity=\"0.45\"/> <circle cx=\"86\" cy=\"14\" r=\"2.2\" fill=\"#F5EFE0\" opacity=\"0.45\"/> <circle cx=\"86\" cy=\"86\" r=\"2.2\" fill=\"#F5EFE0\" opacity=\"0.45\"/> <circle cx=\"14\" cy=\"86\" r=\"2.2\" fill=\"#F5EFE0\" opacity=\"0.45\"/>"}];
const BLEED = 3, OVERLAP = 15;
const $ = id => document.getElementById(id);
const state = { pattern: PATTERNS[0]?.id, shape: "drum", lit: false };

PATTERNS.forEach(p => $("pattern").add(new Option(p.name, p.id)));

function segment(id, key, map = v => v) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$(id).children].forEach(x => x.classList.toggle("on", x === b));
    state[key] = map(b.dataset.v); render();
  });
}
segment("shape", "shape");
segment("light", "lit", v => v === "on");
$("pattern").addEventListener("change", () => { state.pattern = $("pattern").value; render(); });
["dt", "db", "h", "motif"].forEach(id => $(id).addEventListener("input", render));

function dims() {
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, +v || lo));
  let dt = clamp($("dt").value, 80, 600), db = clamp($("db").value, 80, 600);
  const h = clamp($("h").value, 80, 500);
  if (state.shape === "drum") db = dt;
  $("db").disabled = state.shape === "drum";
  return { dt, db, h, motif: +$("motif").value };
}

// <pattern> scaled so one tile repeat measures `motifMM` in the target's units-per-mm.
function patternDef(id, pxPerMm, motifMM) {
  const p = PATTERNS.find(x => x.id === state.pattern);
  const s = (motifMM * pxPerMm) / p.size;
  return `<pattern id="${id}" width="${p.size}" height="${p.size}" patternUnits="userSpaceOnUse"
    patternTransform="scale(${s.toFixed(4)})">${p.body}</pattern>`;
}

function mockupSVG(d, lit) {
  const W = 400, Hh = 520, maxShade = 300;
  const k = Math.min(maxShade / Math.max(d.dt, d.db), 240 / d.h);
  const tw = d.dt * k, bw = d.db * k, sh = d.h * k;
  const top = 60, cx = W / 2, bot = top + sh;
  const shade = `M${cx - tw / 2},${top} L${cx + tw / 2},${top} L${cx + bw / 2},${bot} L${cx - bw / 2},${bot}Z`;
  const ry = 10;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Lamp mockup">
  <defs>
    ${patternDef("pt", k, d.motif)}
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#FFE3B0" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#FFB866" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD08A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFD08A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadeShade" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".4"/>
    </linearGradient>
    <clipPath id="sc"><path d="${shade}"/></clipPath>
  </defs>
  ${lit ? `<ellipse cx="${cx}" cy="${bot + 40}" rx="${Math.min(bw * .9, 198)}" ry="${Math.min(bw * .5, 60)}" fill="url(#pool)"/>
           <ellipse cx="${cx}" cy="${top + sh / 2}" rx="${Math.min(Math.max(tw, bw) * .85, 198)}" ry="${Math.min(sh * .9, 58 + sh / 2)}" fill="url(#glow)" opacity=".5"/>` : ""}
  <rect x="${cx - 4}" y="${bot - 10}" width="8" height="${Hh - 50 - bot + 10}" fill="#2B2B2B"/>
  <ellipse cx="${cx}" cy="${Hh - 42}" rx="70" ry="12" fill="#2B2B2B"/>
  <rect x="${cx - 70}" y="${Hh - 54}" width="140" height="12" fill="#2B2B2B"/>
  <ellipse cx="${cx}" cy="${Hh - 54}" rx="70" ry="12" fill="#3A3A3A"/>
  <g clip-path="url(#sc)">
    <rect x="0" y="${top}" width="${W}" height="${sh}" fill="url(#pt)"/>
    ${lit ? `<rect x="0" y="${top}" width="${W}" height="${sh}" fill="url(#glow)" style="mix-blend-mode:screen"/>`
          : `<rect x="0" y="${top}" width="${W}" height="${sh}" fill="url(#shadeShade)"/>`}
  </g>
  <ellipse cx="${cx}" cy="${top}" rx="${tw / 2}" ry="${ry}" fill="${lit ? "#FFE9C2" : "#141C47"}" stroke="#0B1030" stroke-width="1"/>
  <path d="M${cx - bw / 2},${bot} A${bw / 2},${ry} 0 0 0 ${cx + bw / 2},${bot}" fill="none" stroke="#0B1030" stroke-width="1.5"/>
</svg>`;
}

// Flat wrap. Drum → rectangle of circumference × height. Tapered → annular sector
// (the unrolled cone frustum), apex at top.
function wrapGeometry(d) {
  if (Math.abs(d.db - d.dt) < 1) {
    const w = Math.PI * d.dt + OVERLAP;
    return { kind: "rect", w, h: d.h, seamX: w - OVERLAP };
  }
  const small = Math.min(d.dt, d.db), big = Math.max(d.dt, d.db);
  const slant = Math.hypot(d.h, (big - small) / 2);
  const R = slant * big / (big - small), r = R - slant;
  const theta = (Math.PI * big) / R + OVERLAP / R;
  return { kind: "sector", R, r, theta, seamA: theta / 2 - OVERLAP / R, flip: d.dt > d.db, slant };
}

function sectorPath(cx, cy, R, r, t) {
  const pt = (rad, a) => [cx + rad * Math.sin(a), cy + rad * Math.cos(a)].map(n => n.toFixed(3)).join(",");
  const large = t > Math.PI ? 1 : 0;
  return `M${pt(R, -t / 2)} A${R},${R} 0 ${large} 0 ${pt(R, t / 2)} L${pt(r, t / 2)} A${r},${r} 0 ${large} 1 ${pt(r, -t / 2)}Z`;
}

function wrapSVG(d) {
  const g = wrapGeometry(d), m = 12;   // margin in mm for labels
  const p = PATTERNS.find(x => x.id === state.pattern);
  let w, h, art, cut, seam;
  if (g.kind === "rect") {
    w = g.w + 2 * (BLEED + m); h = g.h + 2 * (BLEED + m);
    const x = m + BLEED, y = m + BLEED;
    art = `<rect x="${m}" y="${m}" width="${g.w + 2 * BLEED}" height="${g.h + 2 * BLEED}" fill="url(#pt)"/>`;
    cut = `<rect x="${x}" y="${y}" width="${g.w}" height="${g.h}"/>`;
    seam = `<line x1="${x + g.seamX}" y1="${y}" x2="${x + g.seamX}" y2="${y + g.h}"/>`;
  } else {
    // Bounding box of the sector (apex at origin, opening downward).
    const tb = g.theta / 2 + BLEED / g.r;
    const Rb = g.R + BLEED, rb = Math.max(0, g.r - BLEED);
    const xs = [], ys = [];
    for (let i = 0; i <= 200; i++) {
      const a = -tb + (2 * tb * i) / 200;
      [Rb, rb].forEach(rad => { xs.push(rad * Math.sin(a)); ys.push(rad * Math.cos(a)); });
    }
    const minX = Math.min(...xs), minY = Math.min(...ys);
    w = Math.max(...xs) - minX + 2 * m; h = Math.max(...ys) - minY + 2 * m;
    const cx = m - minX, cy = m - minY;
    art = `<path d="${sectorPath(cx, cy, Rb, rb, 2 * tb)}" fill="url(#pt)"/>`;
    cut = `<path d="${sectorPath(cx, cy, g.R, g.r, g.theta)}"/>`;
    const s = [g.r, g.R].map(rad => [cx + rad * Math.sin(g.seamA), cy + rad * Math.cos(g.seamA)]);
    seam = `<line x1="${s[0][0]}" y1="${s[0][1]}" x2="${s[1][0]}" y2="${s[1][1]}"/>`;
  }
  const label = `${p.name} · ${state.shape === "drum" ? "Drum" : "Tapered"} · top Ø${d.dt} / bottom Ø${d.db} / H${d.h} mm · motif ${d.motif} mm`;
  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${w.toFixed(2)}mm" height="${h.toFixed(2)}mm" viewBox="0 0 ${w.toFixed(3)} ${h.toFixed(3)}">
  <title>${label}</title>
  <defs>${patternDef("pt", 1, d.motif)}</defs>
  <g id="artwork">${art}</g>
  <g id="cut-line" fill="none" stroke="#E0001B" stroke-width="0.25">${cut}</g>
  <g id="glue-overlap" fill="none" stroke="#E0001B" stroke-width="0.25" stroke-dasharray="2 1.5">${seam}</g>
  <text x="${m}" y="${m * 0.6}" font-family="sans-serif" font-size="3.5" fill="#333">${label} · print at 100% · 3 mm bleed · dashed = ${OVERLAP} mm glue overlap${g.flip ? " · wide edge is the TOP of the shade" : ""}</text>
</svg>`;
}

function render() {
  const d = dims();
  $("motifOut").textContent = d.motif;
  $("stage").classList.toggle("lit", state.lit);
  $("stage").innerHTML = mockupSVG(d, state.lit);
  const g = wrapGeometry(d);
  const flat = g.kind === "rect" ? [g.w, g.h] : (() => {
    const svg = new DOMParser().parseFromString(wrapSVG(d), "image/svg+xml").documentElement;
    return svg.getAttribute("viewBox").split(" ").slice(2).map(Number).map(n => n - 24);
  })();
  const area = (Math.PI * (d.dt + d.db) / 2 * (g.slant || d.h)) / 1e6;
  const repeats = Math.round(Math.PI * Math.max(d.dt, d.db) / d.motif);
  const big = Math.max(...flat) > 1000;
  $("spec").innerHTML = `
    <dt>Flat sheet</dt><dd>${flat[0].toFixed(0)} × ${flat[1].toFixed(0)} mm${big ? ' <span class="warn">(over 1 m: check printer width)</span>' : ""}</dd>
    <dt>Shade surface</dt><dd>${area.toFixed(3)} m²</dd>
    <dt>Repeats around</dt><dd>${repeats}</dd>
    ${g.kind === "sector" ? `<dt>Slant height</dt><dd>${g.slant.toFixed(1)} mm</dd>` : ""}`;
}

function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "image/svg+xml" }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const fileBase = () => { const d = dims(); return `${state.pattern}-${state.shape}-${d.dt}x${d.db}x${d.h}`; };
$("dl").onclick = () => download(`${fileBase()}-wrap.svg`, wrapSVG(dims()));
$("dlMock").onclick = () => download(`${fileBase()}-mockup.svg`, mockupSVG(dims(), state.lit));

render();
</script>
</body>
</html>
